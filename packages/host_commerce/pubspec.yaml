name: host_commerce
description: >-
  Reusable commerce contract layer for Flutter apps: membership/credits state,
  in-app purchase and restore, and paywall screens. Extracted from Veditor.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  # Keep Google Play Billing 7.1.1 until the store pipeline supports the
  # Billing 8 API.
  in_app_purchase: 3.2.4
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
